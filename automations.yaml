  description: ''
  triggers:
  - type: changed_states
    device_id: b399cd951f44afcc2ed2f8208babc7f0
    entity_id: 933172b9479cb53c41aebb00bb280509
    domain: switch
    trigger: device
    for:
      hours: 1
      minutes: 30
      seconds: 0
  conditions: []
  actions:
  - type: turn_off
    device_id: b399cd951f44afcc2ed2f8208babc7f0
    entity_id: 933172b9479cb53c41aebb00bb280509
    domain: switch
  mode: single
- id: telegram_callback_handler
  alias: Telegram - Callback Handler
  description: ''
  triggers:
  - trigger: event
    event_type: telegram_callback
  actions:
  - action: telegram_bot.answer_callback_query
    data:
      callback_query_id: '{{ trigger.event.data.id }}'
      message: Laden...
  - variables:
      parts: '{{ trigger.event.data.data.split('':'') }}'
      cmd: '{{ parts[0] }}'
      target: '{{ parts[1] if parts|length > 1 else '''' }}'
      extra: '{{ parts[2] if parts|length > 2 else '''' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ cmd == ''/f'' }}'
      sequence:
      - variables:
          rooms: '{% if target == ''Zolder'' %} [''Mika'', ''Overloop'', ''Bergruimte'']
            {% elif target == ''1e Verdieping'' %} [''Slaapkamer'', ''Kantoor'', ''Yulian'',
            ''Badkamer''] {% elif target == ''Begane Grond'' %} [''Woonkamer'', ''Eetkamer'',
            ''Serre'', ''Keuken'', ''Schuur'', ''Hal''] {% else %} [] {% endif %}

            '
      - action: telegram_bot.edit_message
        data:
          chat_id: '{{ trigger.event.data.chat_id }}'
          message_id: '{{ trigger.event.data.message.message_id }}'
          title: "\U0001F4CD {{ target }}"
          message: 'Kies een kamer:'
          inline_keyboard: "{% set ns = namespace(buttons=[]) %} {% for room in rooms
            %}\n  {% set ns.buttons = ns.buttons + [\"\U0001F6AA \" ~ room ~ \":/r:\"
            ~ room ~ \":\" ~ target] %}\n{% endfor %} {{ ns.buttons + [\"\U0001F519
            Terug:/menu_cmd\"] }}\n"
    - conditions:
      - condition: template
        value_template: '{{ cmd == ''/r'' }}'
      sequence:
      - variables:
          entities: '{{ area_entities(target) or area_entities(target|lower|replace(''
            '',''_'')) }}'
      - if:
        - condition: template
          value_template: '{{ entities == none or entities | count == 0 }}'
        then:
        - action: telegram_bot.edit_message
          data:
            chat_id: '{{ trigger.event.data.chat_id }}'
            message_id: '{{ trigger.event.data.message.message_id }}'
            message: ⚠️ Geen apparaten gevonden in '{{ target }}'.
            inline_keyboard:
            - "\U0001F519 Terug:/f:{{ extra }}"
        else:
        - action: telegram_bot.edit_message
          data:
            chat_id: '{{ trigger.event.data.chat_id }}'
            message_id: '{{ trigger.event.data.message.message_id }}'
            title: "\U0001F4A1 {{ target }}"
            message: 'Bediening:'
            inline_keyboard: "{% set ns = namespace(buttons=[]) %} {% set devs = expand(entities)
              \n    | selectattr('domain', 'in', ['light','switch','media_player','cover','lock'])
              \n    | sort(attribute='name') %}\n{% for dev in devs %}\n  {% set icon
              = '\U0001F7E1' if dev.state in ['on','open','unlocked'] else '⚫' %}\n
              \ {% set label = icon ~ \" \" ~ dev.name %}\n  {% set ns.buttons = ns.buttons
              + [label ~ \":/t:\" ~ dev.entity_id ~ \":\" ~ target ~ \":\" ~ extra]
              %}\n{% endfor %} {{ ns.buttons + [\"\U0001F519 Terug:/f:\" ~ extra,
              \"\U0001F3E0 Menu:/menu_cmd\"] }}\n"
    - conditions:
      - condition: template
        value_template: '{{ cmd == ''/t'' }}'
      sequence:
      - action: homeassistant.toggle
        target:
          entity_id: '{{ target }}'
      - delay: 00:00:01
      - action: telegram_bot.edit_message
        data:
          chat_id: '{{ trigger.event.data.chat_id }}'
          message_id: '{{ trigger.event.data.message.message_id }}'
          message: 'Status bijgewerkt voor {{ state_attr(target, ''friendly_name'')
            or ''apparaat'' }}:'
          inline_keyboard: "{% set room_name = extra %} {% set floor_name = parts[3]
            if parts|length > 3 else '' %} {% set entities = area_entities(room_name)
            or area_entities(room_name|lower|replace(' ','_')) %} {% set ns = namespace(buttons=[])
            %} {% set devs = expand(entities) | selectattr('domain', 'in', ['light','switch','media_player','cover','lock'])
            | sort(attribute='name') %} {% for dev in devs %}\n  {% set icon = '\U0001F7E1'
            if dev.state in ['on','open','unlocked'] else '⚫' %}\n  {% set label =
            icon ~ \" \" ~ dev.name %}\n  {% set ns.buttons = ns.buttons + [label
            ~ \":/t:\" ~ dev.entity_id ~ \":\" ~ room_name ~ \":\" ~ floor_name] %}\n{%
            endfor %} {{ ns.buttons + [\"\U0001F519 Terug:/f:\" ~ floor_name, \"\U0001F3E0
            Hoofdmenu:/menu_cmd\"] }}\n"
    - conditions:
      - condition: template
        value_template: '{{ cmd == ''/menu_cmd'' }}'
      sequence:
      - action: telegram_bot.edit_message
        data:
          chat_id: '{{ trigger.event.data.chat_id }}'
          message_id: '{{ trigger.event.data.message.message_id }}'
          title: "\U0001F3E1 Huize Steenhagen"
          message: 'Kies een verdieping:'
          inline_keyboard:
          - "\U0001F3DA️ Zolder:/f:Zolder"
          - "\U0001F6CF️ 1e Verdieping:/f:1e Verdieping"
          - "\U0001F6CB️ Begane Grond:/f:Begane Grond"
          - "\U0001F4CA Status:/status, \U0001F3AC Scenes:/scenes"
    - conditions:
      - condition: template
        value_template: '{{ cmd == ''/status'' }}'
      sequence:
      - action: telegram_bot.edit_message
        data:
          chat_id: '{{ trigger.event.data.chat_id }}'
          message_id: '{{ trigger.event.data.message.message_id }}'
          message: "\U0001F321️ Woonkamer: {{ states('sensor.thermostaat_temperatuur')
            }}°C"
          inline_keyboard:
          - "\U0001F519 Terug:/menu_cmd"
    - conditions:
      - condition: template
        value_template: '{{ cmd == ''/scenes'' }}'
      sequence:
      - action: telegram_bot.edit_message
        data:
          chat_id: '{{ trigger.event.data.chat_id }}'
          message_id: '{{ trigger.event.data.message.message_id }}'
          message: 'Scenes:'
          inline_keyboard:
          - "\U0001F634 Jeroen Slaapt:/call:automation.trigger:automation.jeroen_slaapt"
          - "\U0001F519 Terug:/menu_cmd"
