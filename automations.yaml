- id: telegram_battery_direct_alert
  alias: 'Telegram: Batterij Alert (Direct)'
  description: ''
  triggers:
  - event_type: state_changed
    trigger: event
  conditions:
  - condition: template
    value_template: "{% set state = trigger.event.data.new_state %} {% set old_state
      = trigger.event.data.old_state %} {{ state is not none \n   and state.entity_id.startswith('binary_sensor.')\n
      \  and state.attributes.device_class == 'battery'\n   and state.state == 'on'\n
      \  and (old_state is none or old_state.state != 'on') }}\n"
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.telegram_thuisapp
    data:
      title: "\U0001F6A8 *Batterij Alert*"
      message: "{% set entity_id = trigger.event.data.entity_id %} De batterij van
        *{{ state_attr(entity_id, 'friendly_name') | replace(' battery low', '') }}*
        is leeg.\n\U0001F4CD *Locatie:* {{ area_name(entity_id) or 'Niet toegewezen'
        }} \U0001F50B *Type:* {{ state_attr(entity_id, 'battery_type') or 'Onbekend'
        }}\n"
      data:
        parse_mode: Markdown
  mode: parallel
  max: 10
