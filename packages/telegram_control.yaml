# Telegram Bot Configuratie - Dict format voorkomt de 'expected a dict' fout
telegram_bot:
  platform: polling
  api_key: !secret telegram_api_key
  allowed_chat_ids:
    - !secret telegram_chatid_family
    - !secret telegram_chatid_test
    - !secret telegram_id_jeroen
    - !secret telegram_id_mika
    - !secret telegram_id_yulian
    - !secret telegram_id_linda

automation:
  # ----------------------------------------------------------------------------
  # 1. HOOFDMENU
  # ----------------------------------------------------------------------------
  - alias: "Telegram - Toon Huis Menu"
    id: "telegram_main_menu"
    trigger:
      - trigger: event
        event_type: telegram_command
        event_data:
          command: "/menu"
      - trigger: event
        event_type: telegram_command
        event_data:
          command: "/start"
    action:
      - action: telegram_bot.send_message
        data:
          target: "{{ trigger.event.data.chat_id }}"
          title: "🏡 **Huize Steenhagen**"
          message: "Kies een verdieping of actie:"
          inline_keyboard:
            - "🏚️ Zolder:/f:Zolder"
            - "🛏️ 1e Verdieping:/f:1e Verdieping"
            - "🛋️ Begane Grond:/f:Begane Grond"
            - "📊 Status:/status, 🎬 Scenes:/scenes"

  # ----------------------------------------------------------------------------
  # 2. LOGICA & ACTIES (Callback Handler)
  # ----------------------------------------------------------------------------
  - alias: "Telegram - Callback Handler"
    id: "telegram_callback_handler"
    trigger:
      - trigger: event
        event_type: telegram_callback
    action:
      # Stop de 'loading' spinner direct
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "Laden..."

      - variables:
          parts: "{{ trigger.event.data.data.split(':') }}"
          cmd: "{{ parts[0] }}"
          target: "{{ parts[1] if parts|length > 1 else '' }}"
          extra: "{{ parts[2] if parts|length > 2 else '' }}"

      - choose:
          # --- STAP 1: KIES KAMER ---
          - conditions: "{{ cmd == '/f' }}"
            sequence:
              - variables:
                  rooms: >
                    {% if target == 'Zolder' %} ['Mika', 'Overloop', 'Bergruimte']
                    {% elif target == '1e Verdieping' %} ['Slaapkamer', 'Kantoor', 'Yulian', 'Badkamer']
                    {% elif target == 'Begane Grond' %} ['Woonkamer', 'Eetkamer', 'Serre', 'Keuken', 'Schuur', 'Hal']
                    {% else %} [] {% endif %}
              - action: telegram_bot.edit_message
                data:
                  chat_id: "{{ trigger.event.data.chat_id }}"
                  message_id: "{{ trigger.event.data.message.message_id }}"
                  title: "📍 {{ target }}"
                  message: "Kies een kamer:"
                  inline_keyboard: >
                    {% set ns = namespace(buttons=[]) %}
                    {% for room in rooms %}
                      {% set ns.buttons = ns.buttons + ["🚪 " ~ room ~ ":/r:" ~ room ~ ":" ~ target] %}
                    {% endfor %}
                    {{ ns.buttons + ["🔙 Terug:/menu_cmd"] }}

          # --- STAP 2: KIES APPARAAT ---
          - conditions: "{{ cmd == '/r' }}"
            sequence:
              - variables:
                  entities: "{{ area_entities(target) or area_entities(target|lower|replace(' ','_')) }}"
              - if: "{{ entities == none or entities | count == 0 }}"
                then:
                  - action: telegram_bot.edit_message
                    data:
                      chat_id: "{{ trigger.event.data.chat_id }}"
                      message_id: "{{ trigger.event.data.message.message_id }}"
                      message: "⚠️ Geen apparaten gevonden in '{{ target }}'."
                      inline_keyboard: ["🔙 Terug:/f:{{ extra }}"]
                else:
                  - action: telegram_bot.edit_message
                    data:
                      chat_id: "{{ trigger.event.data.chat_id }}"
                      message_id: "{{ trigger.event.data.message.message_id }}"
                      title: "💡 {{ target }}"
                      message: "Bediening:"
                      inline_keyboard: >
                        {% set ns = namespace(buttons=[]) %}
                        {% set devs = expand(entities) 
                            | selectattr('domain', 'in', ['light','switch','media_player','cover','lock']) 
                            | sort(attribute='name') %}
                        {% for dev in devs %}
                          {% set icon = '🟡' if dev.state in ['on','open','unlocked'] else '⚫' %}
                          {% set label = icon ~ " " ~ dev.name %}
                          {% set ns.buttons = ns.buttons + [label ~ ":/t:" ~ dev.entity_id ~ ":" ~ target ~ ":" ~ extra] %}
                        {% endfor %}
                        {{ ns.buttons + ["🔙 Terug:/f:" ~ extra, "🏠 Menu:/menu_cmd"] }}

          # --- STAP 3: TOGGLE ACTIE ---
          - conditions: "{{ cmd == '/t' }}"
            sequence:
              - action: homeassistant.toggle
                target:
                  entity_id: "{{ target }}"
              - delay: "00:00:01"
              - action: telegram_bot.edit_message
                data:
                  chat_id: "{{ trigger.event.data.chat_id }}"
                  message_id: "{{ trigger.event.data.message.message_id }}"
                  message: "Status bijgewerkt voor {{ state_attr(target, 'friendly_name') or 'apparaat' }}:"
                  inline_keyboard: >
                    {% set room_name = extra %}
                    {% set floor_name = parts[3] if parts|length > 3 else '' %}
                    {% set entities = area_entities(room_name) or area_entities(room_name|lower|replace(' ','_')) %}
                    {% set ns = namespace(buttons=[]) %}
                    {% set devs = expand(entities) | selectattr('domain', 'in', ['light','switch','media_player','cover','lock']) | sort(attribute='name') %}
                    {% for dev in devs %}
                      {% set icon = '🟡' if dev.state in ['on','open','unlocked'] else '⚫' %}
                      {% set label = icon ~ " " ~ dev.name %}
                      {% set ns.buttons = ns.buttons + [label ~ ":/t:" ~ dev.entity_id ~ ":" ~ room_name ~ ":" ~ floor_name] %}
                    {% endfor %}
                    {{ ns.buttons + ["🔙 Terug:/f:" ~ floor_name, "🏠 Hoofdmenu:/menu_cmd"] }}

          # --- NAVIGATIE COMMANDS ---
          - conditions: "{{ cmd == '/menu_cmd' }}"
            sequence:
              - action: telegram_bot.edit_message
                data:
                  chat_id: "{{ trigger.event.data.chat_id }}"
                  message_id: "{{ trigger.event.data.message.message_id }}"
                  title: "🏡 Huize Steenhagen"
                  message: "Kies een verdieping:"
                  inline_keyboard:
                    - "🏚️ Zolder:/f:Zolder"
                    - "🛏️ 1e Verdieping:/f:1e Verdieping"
                    - "🛋️ Begane Grond:/f:Begane Grond"
                    - "📊 Status:/status, 🎬 Scenes:/scenes"

          - conditions: "{{ cmd == '/status' }}"
            sequence:
              - action: telegram_bot.edit_message
                data:
                  chat_id: "{{ trigger.event.data.chat_id }}"
                  message_id: "{{ trigger.event.data.message.message_id }}"
                  message: "🌡️ Woonkamer: {{ states('sensor.thuis_temperatuur') }}°C"
                  inline_keyboard: ["🔙 Terug:/menu_cmd"]

          - conditions: "{{ cmd == '/scenes' }}"
            sequence:
              - action: telegram_bot.edit_message
                data:
                  chat_id: "{{ trigger.event.data.chat_id }}"
                  message_id: "{{ trigger.event.data.message.message_id }}"
                  message: "Scenes:"
                  inline_keyboard:
                    - "😴 Jeroen Slaapt:/call:automation.trigger:automation.jeroen_slaapt"
                    - "🔙 Terug:/menu_cmd"

  # ----------------------------------------------------------------------------
  # 3. ASSIST AI (Fallback voor tekst)
  # ----------------------------------------------------------------------------
  - alias: "Telegram - Assist AI"
    id: "telegram_assist_ai"
    trigger:
      - trigger: event
        event_type: telegram_text
    condition:
      - condition: template
        value_template: "{{ not trigger.event.data.text.startswith('/') }}"
    action:
      - action: telegram_bot.send_chat_action
        data:
          target: "{{ trigger.event.data.chat_id }}"
          action: typing
      - action: conversation.process
        data:
          text: "{{ trigger.event.data.text }}"
          language: "nl"
        response_variable: agent
      - action: telegram_bot.send_message
        data:
          target: "{{ trigger.event.data.chat_id }}"
          message: "{{ agent.response.speech.plain.speech }}"